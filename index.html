<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังแบบทดสอบออนไลน์</title>
    <style>
        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        
        .page {
            display: none;
        }
        .active-page {
            display: block;
        }

        .main-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 20px;
        }
        .main-header h1 {
            color: #1a5276;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }
        .main-header p {
            color: #666;
            margin: 0;
            font-size: 1.05rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card.green {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        .stat-card.purple {
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .stat-label {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .section-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .subject-card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #3498db;
        }
        .subject-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subject-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .subject-desc {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .subject-meta {
            font-size: 0.85rem;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 15px;
            background: #ebf5fb;
            padding: 4px 10px;
            border-radius: 20px;
            width: fit-content;
        }
        .btn-start {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover {
            background-color: #2980b9;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
        }
        .btn-back {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-back:hover {
            background: #7f8c8d;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 18px 20px;
            margin-top: 15px;
        }
        .question-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .option-label:hover {
            background-color: #ebf5fb;
        }
        .option-label input {
            margin-right: 10px;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background-color: #219150;
        }
        #result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background-color: #d4efdf;
            border: 1px solid #27ae60;
        }
        #result-score {
            font-size: 2rem;
            font-weight: bold;
            color: #1e8449;
        }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .correct-ans {
            background-color: #e8f8f5;
            color: #117864;
            border-left: 5px solid #27ae60;
        }
        .wrong-ans {
            background-color: #fadbd8;
            color: #78281f;
            border-left: 5px solid #c0392b;
        }
        .exp-header {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1>🎓 ระบบคลังแบบทดสอบออนไลน์</h1>
        <p>ทดสอบความรู้ พร้อมระบบเฉลยและคำอธิบายโดยละเอียดครบถ้วนทุกข้อ</p>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboard-page" class="page active-page">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">วิชาทั้งหมด</div>
                <div class="stat-number" id="total-subjects">0</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">คลังข้อสอบทั้งหมด</div>
                <div class="stat-number" id="total-questions">0</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">โหมดเฉลย</div>
                <div class="stat-number">ละเอียด 100%</div>
            </div>
        </div>

        <div class="section-title">📚 เลือกรายวิชาที่ต้องการทดสอบ</div>
        <div class="subjects-grid" id="subjects-grid"></div>
    </div>

    <!-- QUIZ PAGE -->
    <div id="quiz-page" class="page">
        <div class="quiz-top-bar">
            <button class="btn-back" onclick="showDashboard()">← กลับหน้า Dashboard</button>
            <h2 id="current-quiz-title" style="margin:0; font-size:1.2rem; color:#2c3e50;">วิชา...</h2>
        </div>

        <form id="quiz-form">
            <div id="quiz-container"></div>
            <button type="button" class="submit-btn" onclick="checkQuiz()">ส่งคำตอบและตรวจคะแนน</button>
        </form>

        <div id="result-box">
            <h2>ผลการทำแบบทดสอบ</h2>
            <div id="result-score">0 / 0</div>
            <p id="result-text"></p>
            <button class="btn-back" style="background:#27ae60; margin-top:15px;" onclick="showDashboard()">ทำแบบทดสอบวิชาอื่นต่อ</button>
        </div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // คลังข้อมูลแบบทดสอบ (ภูมิศาสตร์ 65 ข้อ + พระพุทธศาสนา 25 ข้อ)
    // -------------------------------------------------------------
    const quizData = {
        buddhism: {
            title: "พระพุทธศาสนา (25 ข้อ)",
            icon: "☸️",
            desc: "แบบทดสอบหลักธรรม พุทธประวัติ สังคายนา และวันสำคัญทางพระพุทธศาสนาครบถ้วน",
            questions: [
                {
                    q: "1. สังฆคุณข้อใดจัดเป็น 'ความดีที่เป็นเหตุ'?",
                    options: ["ก. เป็นผู้ปฏิบัติดี", "ข. เป็นผู้ควรแก่การยกย่อง", "ค. เป็นผู้ควรแก่การกราบไหว้", "ง. เป็นนาบุญอันประเสริฐของโลก"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. เป็นผู้ปฏิบัติดี</b><br>• สุปฏิปันโน (ปฏิบัติดี) จัดเป็น 'เหตุคุณ' ส่วนข้ออื่นๆ จัดเป็น 'ผลคุณ' ที่เกิดจากการปฏิบัติดี"
                },
                {
                    q: "2. 'เห็นรถจักรยานยนต์จอดอยู่หน้าบ้านหลังหนึ่งรู้สึกชอบจึงไปขโมยมา' อะไรคือ 'กิเลส'?",
                    options: ["ก. การขโมยรถ", "ข. การถูกตำรวจจับ", "ค. ความอยากได้", "ง. รถจักรยานยนต์"],
                    ans: "ค",
                    explain: "<b>เฉลยข้อ ค. ความอยากได้</b><br>• ความอยากได้เป็น 'โลภะ' (กิเลสในจิตใจ) การขโมยเป็น 'กรรม' (การกระทำ) และการถูกจับเป็น 'วิบาก' (ผลกรรม)"
                },
                {
                    q: "3. หากต้องการมีฐานะร่ำรวยหรือเจริญก้าวหน้าในหน้าที่การงาน ควรนำหลักธรรมข้อใดไปปฏิบัติ?",
                    options: ["ก. อิทธิบาท ๔", "ข. พรหมวิหาร ๔", "ค. สัปปุริสธรรม ๗", "ง. ทิฏฐธัมมิกัตถะ ๔"],
                    ans: "ง",
                    explain: "<b>เฉลยข้อ ง. ทิฏฐธัมมิกัตถะ ๔</b><br>• หัวใจเศรษฐี (อุ อา กะ สะ) คือ ธรรมะที่เป็นไปเพื่อประโยชน์และความตั้งมั่นในปัจจุบัน"
                },
                {
                    q: "4. 'คนเสพตาย คนขายติดคุก' ข้อความนี้น่าจะกระตุ้นให้คนขายมีมรรค 8 ในข้อใด?",
                    options: ["ก. สัมมาอาชีวะ", "ข. สัมมาวาจา", "ค. สัมมากัมมันตะ", "ง. สัมมาสมาธิ"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. สัมมาอาชีวะ</b><br>• คือการประกอบอาชีพสุจริต ไม่ค้าขายสิ่งที่เป็นอันตราย เช่น ยาเสพติด หรือมิจฉาวณิชชา"
                },
                {
                    q: "5. บุคคลใดที่เข้าเฝ้าพระพุทธเจ้าแล้วกราบทูลให้พระองค์เสด็จปรินิพพาน?",
                    options: ["ก. มาร", "ข. พระอานนท์", "ค. พระเจ้าพิมพิสาร", "ง. ท้าวสหัมบดีพรหม"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. มาร</b><br>• พญามารเข้าเฝ้าทูลขอให้ปรินิพพาน พระองค์จึงทรงปลงอายุสังขาร ณ ปาวาลเจดีย์"
                },
                {
                    q: "6. วันสำคัญทางพระพุทธศาสนาวันใดที่เกิดเหตุการณ์ 'จาตุรงคสันนิบาต'?",
                    options: ["ก. วันวิสาขบูชา", "ข. วันมาฆบูชา", "ค. วันอาสาฬหบูชา", "ง. วันอัฏฐมีบูชา"],
                    ans: "ข",
                    explain: "<b>เฉลยข้อ ข. วันมาฆบูชา</b><br>• เป็นวันที่พระสงฆ์สาวก 1,250 รูปมาประชุมพร้อมกันโดยมิได้นัดหมาย ซึ่งตรงกับวันเพ็ญขึ้น 15 ค่ำ เดือน 3"
                },
                {
                    q: "7. พระพุทธเจ้าทรงแสดงธรรมเทศนากัณฑ์แรกคือ 'ธัมมจักกัปปวัตตนสูตร' ในวันสำคัญใด?",
                    options: ["ก. วันมาฆบูชา", "ข. วันวิสาขบูชา", "ค. วันอาสาฬหบูชา", "ง. วันอัฏฐมีบูชา"],
                    ans: "ค",
                    explain: "<b>เฉลยข้อ ค. วันอาสาฬหบูชา</b><br>• ปฐมเทศนาแก่ปัญจวัคคีย์ ทำให้เกิดพระอริยสงฆ์รูปแรก และมีพระรัตนตรัยครบ 3 ประการ"
                },
                {
                    q: "8. พระอริยสงฆ์รูปแรกในพระพุทธศาสนาคือท่านใด?",
                    options: ["ก. พระสารีบุตร", "ข. พระโมคคัลลานะ", "ค. พระอัญญาโกณฑัญญะ", "ง. พระอานนท์"],
                    ans: "ค",
                    explain: "<b>เฉลยข้อ ค. พระอัญญาโกณฑัญญะ</b><br>• ได้ดวงตาเห็นธรรมหลังฟังปฐมเทศนาและทูลขออุปสมบทเป็นพระภิกษุรูปแรก"
                },
                {
                    q: "9. หลักธรรมที่เป็นหัวใจสำคัญของพระพุทธศาสนาซึ่งทรงแสดงในวันมาฆบูชาคือข้อใด?",
                    options: ["ก. ธัมมจักกัปปวัตตนสูตร", "ข. โอวาทปาติโมกข์", "ค. อนัตตลักขณสูตร", "ง. มหาปรินิพพานสูตร"],
                    ans: "ข",
                    explain: "<b>เฉลยข้อ ข. โอวาทปาติโมกข์</b><br>• สรุปหลักการ 3 ประการคือ การไม่ทำบาปทั้งปวง การทำความดีให้ถึงพร้อม และการทำจิตใจให้บริสุทธิ์"
                },
                {
                    q: "10. วันถวายพระเพลิงพระบรมศพของพระพุทธเจ้าตรงกับวันสำคัญใด?",
                    options: ["ก. วันวิสาขบูชา", "ข. วันอาสาฬหบูชา", "ค. วันอัฏฐมีบูชา", "ง. วันเข้าพรรษา"],
                    ans: "ค",
                    explain: "<b>เฉลยข้อ ค. วันอัฏฐมีบูชา</b><br>• ตรงกับวันแรม 8 ค่ำ เดือน 6 (หลังวันวิสาขบูชา 8 วัน)"
                },
                {
                    q: "11. การสังคายนาพระไตรปิฎกครั้งที่ 1 จัดขึ้น ณ เมืองใด และมีใครเป็นประธานสงฆ์?",
                    options: ["ก. เมืองราชคฤห์ / พระมหากัสสปะ", "ข. เมืองเวสาลี / พระยสกาตัณฑกบุตร", "ค. เมืองปาตลีบุตร / พระโมคคัลลีบุตรติสสเถระ", "ง. เมืองกะปิละพัสดุ์ / พระอานนท์"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. เมืองราชคฤห์ / พระมหากัสสปะ</b><br>• จัดขึ้นหลังพุทธปรินิพพานได้ 3 เดือน โดยมีพระเจ้าอชาตศัตรูเป็นองค์อุปถัมภ์"
                },
                {
                    q: "12. พระสงฆ์สาวกรูปใดได้รับการยกย่องว่าเป็นผู้เลิศทางด้าน 'ปัญญา'?",
                    options: ["ก. พระโมคคัลลานะ", "ข. พระสารีบุตร", "ค. พระอานนท์", "ง. พระมหากัสสปะ"],
                    ans: "ข",
                    explain: "<b>เฉลยข้อ ข. พระสารีบุตร</b><br>• เป็นอัครสาวกเบื้องขวา เลิศทางปัญญา / <i>พระโมคคัลลานะ:</i> อัครสาวกเบื้องซ้าย เลิศทางฤทธิ์"
                },
                {
                    q: "13. พระสงฆ์สาวกรูปใดได้รับการยกย่องว่าเป็น 'พระพหูสูต' และทรงจำพระธรรมบทต่างๆ ได้มากที่สุด?",
                    options: ["ก. พระอานนท์", "ข. พระอุบาลี", "ค. พระสารีบุตร", "ง. พระราหุล"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. พระอานนท์</b><br>• เป็นพระพุทธอุปฐากผู้รับหน้าที่วิสัชนาพระสูตรในการสังคายนาครั้งที่ 1"
                },
                {
                    q: "14. ข้อใดจัดเป็น 'อริยสัจ 4' ตามลำดับที่ถูกต้อง?",
                    options: ["ก. ทุกข์ สมุทัย นิโรธ มรรค", "ข. สมุทัย ทุกข์ มรรค นิโรธ", "ค. ทุกข์ นิโรธ สมุทัย มรรค", "ง. มรรค นิโรธ ทุกข์ สมุทัย"],
                    ans: "ก",
                    explain: "<b>เฉลยข้อ ก. ทุกข์ สมุทัย นิโรธ มรรค</b><br>• ทุกข์ (ปัญหา) - สมุทัย (สาเหตุ) - นิโรธ (การดับปัญหา) - มรรค (หนทางแก้ไข)"

    let activeSubjectKey = "";

    window.onload = function() {
        renderDashboard();
    };

    function renderDashboard() {
        const grid = document.getElementById("subjects-grid");
        grid.innerHTML = "";

        let totalSubjectsCount = 0;
        let totalQuestionsCount = 0;

        for (let key in quizData) {
            totalSubjectsCount++;
            let qCount = quizData[key].questions.length;
            totalQuestionsCount += qCount;

            let card = document.createElement("div");
            card.className = "subject-card";
            card.innerHTML = `
                <div>
                    <div class="subject-icon">${quizData[key].icon}</div>
                    <div class="subject-title">${quizData[key].title}</div>
                    <div class="subject-desc">${quizData[key].desc}</div>
                </div>
                <div>
                    <div class="subject-meta">📝 ${qCount} ข้อ</div>
                    <button class="btn-start" onclick="startQuiz('${key}')">เริ่มทำแบบทดสอบ</button>
                </div>
            `;
            grid.appendChild(card);
        }

        document.getElementById("total-subjects").innerText = totalSubjectsCount;
        document.getElementById("total-questions").innerText = totalQuestionsCount + " ข้อ";
    }

    function startQuiz(subjectKey) {
        activeSubjectKey = subjectKey;
        const currentQuiz = quizData[subjectKey];

        document.getElementById("current-quiz-title").innerText = `${currentQuiz.icon} ${currentQuiz.title}`;
        document.getElementById("result-box").style.display = "none";

        const container = document.getElementById("quiz-container");
        container.innerHTML = "";

        currentQuiz.questions.forEach((qObj, index) => {
            const card = document.createElement("div");
            card.className = "question-card";

            let optionsHtml = "";
            const optionPrefixes = ["ก", "ข", "ค", "ง"];

            qObj.options.forEach((opt, optIndex) => {
                const prefix = optionPrefixes[optIndex];
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${prefix}"> ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-title">${qObj.q}</div>
                <div class="options-group">${optionsHtml}</div>
                <div class="explanation" id="exp${index}"></div>
            `;
            container.appendChild(card);
        });

        document.getElementById("dashboard-page").classList.remove("active-page");
        document.getElementById("quiz-page").classList.add("active-page");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDashboard() {
        document.getElementById("quiz-page").classList.remove("active-page");
        document.getElementById("dashboard-page").classList.add("active-page");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function checkQuiz() {
        const currentQuestions = quizData[activeSubjectKey].questions;
        let score = 0;
        let total = currentQuestions.length;

        currentQuestions.forEach((qObj, index) => {
            let selected = document.querySelector(`input[name="q${index}"]:checked`);
            let expDiv = document.getElementById(`exp${index}`);
            
            expDiv.style.display = "block";
            
            if (selected) {
                if (selected.value === qObj.ans) {
                    score++;
                    expDiv.className = "explanation correct-ans";
                    expDiv.innerHTML = `<div class="exp-header">✓ ถูกต้อง!</div>${qObj.explain}`;
                } else {
                    expDiv.className = "explanation wrong-ans";
                    expDiv.innerHTML = `<div class="exp-header">✗ ตอบผิด (คุณเลือกข้อ ${selected.value})</div>${qObj.explain}`;
                }
            } else {
                expDiv.className = "explanation wrong-ans";
                expDiv.innerHTML = `<div class="exp-header">✗ ยังไม่ได้ตอบข้อนี้</div>${qObj.explain}`;
            }
        });

        let resultBox = document.getElementById("result-box");
        let resultScore = document.getElementById("result-score");
        let resultText = document.getElementById("result-text");

        resultBox.style.display = "block";
        resultScore.innerHTML = `${score} / ${total}`;
        
        if (score === total) {
            resultText.innerHTML = "ยอดเยี่ยมมาก! คุณทำได้คะแนนเต็ม 🥳";
        } else if (score >= total * 0.5) {
            resultText.innerHTML = "ผ่านเกณฑ์! ลองอ่านคำอธิบายด้านล่างเพื่อทบทวนข้อที่ผิดนะครับ ✌️";
        } else {
            resultText.innerHTML = "ลองอ่านคำอธิบายโดยละเอียด แล้วลองทำใหม่อีกครั้งนะครับ 💪";
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
