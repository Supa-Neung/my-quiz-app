<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👾 8-BIT QUIZ ACADEMY 👾</title>
    <!-- Google Fonts: Press Start 2P & Chakra Petch for 8-Bit Feel -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Press+Start+2P&display=map" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- ไฟล์เก็บข้อมูลข้อสอบ -->
    <script src="questions.js"></script>
    <style>
        :root {
            --bg-color: #2b2b36;
            --card-bg: #181825;
            --text-color: #f8f8f2;
            --text-muted: #9595b2;
            --border-color: #ffffff;
            --header-color: #ff79c6;
            --card-sub-bg: #212130;
            --nav-bg: #313145;
            --pixel-green: #50fa7b;
            --pixel-yellow: #f1fa8c;
            --pixel-cyan: #8be9fd;
            --pixel-red: #ff5555;
            --pixel-purple: #bd93f9;
            --box-shadow: 6px 6px 0px #000000;
        }

        [data-theme="light"] {
            --bg-color: #f0f0f4;
            --card-bg: #ffffff;
            --text-color: #282a36;
            --text-muted: #6272a4;
            --border-color: #000000;
            --header-color: #bd93f9;
            --card-sub-bg: #f8f8f2;
            --nav-bg: #e2e2ec;
            --box-shadow: 6px 6px 0px #000000;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(0deg, rgba(0,0,0,0.1) 50%, transparent 50%);
            background-size: 100% 4px; /* Scanline effect */
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .pixel-font {
            font-family: 'Press Start 2P', 'Chakra Petch', cursive;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border: 4px solid var(--border-color);
            box-shadow: var(--box-shadow);
            position: relative;
        }
        
        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--nav-bg);
            border: 3px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 3px 3px 0px #000;
        }
        .theme-toggle:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #000;
        }

        .page { display: none; }
        .active-page { display: block; animation: pixelFade 0.2s steps(4); }

        @keyframes pixelFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .main-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 4px dashed var(--border-color);
            padding-bottom: 20px;
        }
        .main-header h1 {
            color: var(--header-color);
            margin: 0 0 15px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000;
        }
        .main-header p {
            color: var(--pixel-cyan);
            margin: 0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* ส่วนกรอกชื่อผู้ใช้งาน */
        .user-name-box {
            background: var(--card-sub-bg);
            border: 4px solid var(--pixel-purple);
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 4px 4px 0px #000;
        }
        .user-name-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: var(--pixel-yellow);
        }
        .user-name-box input {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--border-color);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            background: var(--card-bg);
            color: var(--pixel-green);
            box-sizing: border-box;
            outline: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--pixel-purple);
            color: #000;
            padding: 15px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            text-align: center;
            font-weight: bold;
        }
        .stat-card.green { background: var(--pixel-green); }
        .stat-card.purple { background: var(--header-color); }
        .stat-number { font-size: 2rem; font-weight: bold; margin-top: 5px; font-family: 'Press Start 2P', monospace; }
        .stat-label { font-size: 0.95rem; text-transform: uppercase; }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--pixel-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 2px 2px 0px #000;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .subject-card {
            background: var(--card-sub-bg);
            border: 3px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 5px 0px #000;
            transition: transform 0.1s;
        }
        .subject-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px #000;
            border-color: var(--pixel-cyan);
        }
        .subject-icon { font-size: 2.8rem; margin-bottom: 10px; }
        .subject-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: var(--pixel-cyan); }
        .subject-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }
        .subject-meta {
            font-size: 0.85rem;
            color: var(--pixel-yellow);
            font-weight: bold;
            margin-bottom: 15px;
            background: var(--nav-bg);
            padding: 4px 10px;
            border: 2px solid var(--border-color);
            width: fit-content;
        }
        .btn-start {
            width: 100%;
            padding: 12px;
            background: var(--pixel-green);
            color: #000;
            border: 3px solid #000;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
        }
        .btn-start:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #000;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--nav-bg);
            padding: 12px 20px;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px #000;
        }
        .btn-back {
            background: var(--pixel-red);
            color: #fff;
            border: 3px solid #000;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold;
            box-shadow: 3px 3px 0px #000;
        }
        .btn-back:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .progress-container {
            width: 100%;
            background-color: var(--nav-bg);
            border: 3px solid var(--border-color);
            height: 16px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .progress-bar {
            height: 100%;
            background: var(--pixel-yellow);
            width: 0%;
            transition: width 0.2s steps(5);
        }

        .question-card {
            background: var(--card-sub-bg);
            border: 3px solid var(--border-color);
            padding: 20px;
            margin-top: 18px;
            box-shadow: 4px 4px 0px #000;
        }
        .question-title { font-weight: bold; font-size: 1.15rem; margin-bottom: 14px; color: var(--pixel-cyan); }
        .options-group { display: flex; flex-direction: column; gap: 10px; }
        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 12px;
            border: 3px solid var(--border-color);
            background: var(--card-bg);
            font-weight: bold;
        }
        .option-label:hover {
            border-color: var(--pixel-yellow);
            background-color: var(--nav-bg);
        }
        .option-label input { margin-right: 12px; transform: scale(1.4); accent-color: var(--header-color); }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--pixel-yellow);
            color: #000;
            border: 4px solid #000;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 5px 5px 0px #000;
            text-transform: uppercase;
        }
        .submit-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #000;
        }

        #result-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            text-align: center;
            background-color: var(--card-sub-bg);
            border: 4px solid var(--pixel-green);
            box-shadow: 6px 6px 0px #000;
        }
        #result-score { font-size: 2.8rem; font-weight: bold; color: var(--pixel-green); font-family: 'Press Start 2P', monospace; margin: 15px 0; }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border: 3px solid var(--border-color);
            font-size: 1rem;
            line-height: 1.5;
        }
        .correct-ans { background-color: rgba(80, 250, 123, 0.15); color: var(--pixel-green); border-color: var(--pixel-green); }
        .wrong-ans { background-color: rgba(255, 85, 85, 0.15); color: var(--pixel-red); border-color: var(--pixel-red); }
        .exp-header { font-weight: bold; margin-bottom: 5px; }

        .analytics-box {
            margin-top: 20px;
            padding: 18px;
            background: var(--card-bg);
            border: 3px dashed var(--pixel-purple);
            text-align: left;
        }

        .save-status {
            margin-top: 15px;
            padding: 12px;
            border: 3px solid var(--border-color);
            font-weight: bold;
        }

        /* Leaderboard Style 8-Bit */
        .leaderboard-container {
            margin-top: 40px;
            background: var(--card-sub-bg);
            padding: 20px;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px #000;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 1rem;
        }
        .leaderboard-table th {
            padding: 12px 10px;
            border-bottom: 4px solid var(--border-color);
            color: var(--pixel-yellow);
            text-transform: uppercase;
        }
        .leaderboard-table td {
            padding: 12px 10px;
            border-bottom: 2px solid var(--border-color);
        }

        /* 8-Bit Blinking Effect */
        .blink {
            animation: blinker 1s steps(2, start) infinite;
        }
        @keyframes blinker {
            to { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">LIGHT MODE</span>
    </button>

    <div class="main-header">
        <h1 class="pixel-font">🎮 8-BIT QUIZ ONLINE 👾</h1>
        <p class="blink"> >> คลังแบบทดสอบออนไลน์ สุ่มโจทย์คำถาม พร้อมระบบจัดอันดับ Guild Leaderboard << </p>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboard-page" class="page active-page">
        <!-- ช่องกรอกชื่อผู้ใช้ -->
        <div class="user-name-box">
            <label for="student-name">🕹️ PLAYER NAME (ชื่อผู้ทดสอบ):</label>
            <input type="text" id="student-name" placeholder="INSERT NAME HERE..." />
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">TOTAL STAGES</div>
                <div class="stat-number" id="total-subjects">0</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">TOTAL QUESTS</div>
                <div class="stat-number" id="total-questions">0</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">MODE</div>
                <div class="stat-number" style="font-size: 1.2rem; margin-top: 15px;">RANDOM 100%</div>
            </div>
        </div>

        <div class="section-title">👾 SELECT STAGE (เลือกวิชา)</div>
        <div class="subjects-grid" id="subjects-grid"></div>

        <!-- กล่องแสดง Leaderboard / อันดับคะแนน -->
        <div class="leaderboard-container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: var(--pixel-yellow); display: flex; align-items: center; gap: 8px;">
                    🏆 HIGH SCORES (TOP 10)
                </h3>
                
                <div style="display: flex; gap: 8px; align-items: center;">
                    <!-- Dropdown เลือกหมวดวิชา -->
                    <select id="leaderboard-filter" onchange="renderLeaderboardTable()" style="padding: 8px; border: 3px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-family: 'Chakra Petch', sans-serif; font-weight:bold;">
                        <option value="ALL">🌐 ALL STAGES</option>
                    </select>
                    <button onclick="loadLeaderboard()" style="padding: 8px 12px; background: var(--pixel-purple); color: #000; border: 3px solid #000; cursor: pointer; font-family: 'Chakra Petch', sans-serif; font-weight:bold;">🔄 REFRESH</button>
                </div>
            </div>

            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">RANK</th>
                        <th>PLAYER</th>
                        <th>STAGE</th>
                        <th style="text-align: center;">SCORE</th>
                        <th style="text-align: right;">%</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px; color: var(--text-muted);">⏳ LOADING HIGH SCORES...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- QUIZ PAGE -->
    <div id="quiz-page" class="page">
        <div class="quiz-top-bar">
            <button class="btn-back" onclick="showDashboard()">◄ EXIT STAGE</button>
            <h2 id="current-quiz-title" style="margin:0; font-size:1.2rem; color:var(--pixel-yellow);">STAGE...</h2>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <form id="quiz-form">
            <div id="quiz-container"></div>
            <button type="button" class="submit-btn" onclick="checkQuiz()">⚔️ SUBMIT ANSWERS</button>
        </form>

        <div id="result-box">
            <h2 class="pixel-font" style="color: var(--pixel-yellow);">STAGE CLEAR!</h2>
            <div id="result-score">0 / 0</div>
            <p id="result-text" style="font-size:1.2rem; margin-top:10px; font-weight:bold;"></p>

            <div id="analytics-container" class="analytics-box"></div>

            <!-- ข้อความแสดงสถานะการบันทึกประวัติ -->
            <div id="save-status" class="save-status" style="display:none;"></div>

            <button class="btn-back" style="background: var(--pixel-green); color:#000; margin-top:20px; font-size:1.1rem; padding:12px 24px;" onclick="startQuiz(activeSubjectKey)">🔄 RETRY STAGE</button>
            <button class="btn-back" style="background: var(--pixel-purple); color:#000; margin-top:20px; font-size:1.1rem; padding:12px 24px;" onclick="showDashboard()">SELECT STAGE</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1KjmxmiaTEzSeoCZY7NgHX6C4oZMD3sOYdnCo5VP6-BQxfNKQ4Ctv2pkk58ShzWUQNw/exec';

    let activeSubjectKey = "";
    let currentShuffledQuestions = [];
    let rawLeaderboardData = [];

    window.onload = function() {
        renderDashboard();
        updateProgress();
        loadLeaderboard();
    };

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById("theme-icon");
        const themeText = document.getElementById("theme-text");

        if (body.getAttribute("data-theme") === "light") {
            body.removeAttribute("data-theme");
            themeIcon.innerText = "🌙";
            themeText.innerText = "LIGHT MODE";
        } else {
            body.setAttribute("data-theme", "light");
            themeIcon.innerText = "☀️";
            themeText.innerText = "DARK MODE";
        }
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderDashboard() {
        const grid = document.getElementById("subjects-grid");
        grid.innerHTML = "";

        let totalSubjectsCount = 0;
        let totalQuestionsCount = 0;

        for (let key in quizData) {
            totalSubjectsCount++;
            let qCount = quizData[key].questions.length;
            totalQuestionsCount += qCount;

            let card = document.createElement("div");
            card.className = "subject-card";
            card.innerHTML = `
                <div>
                    <div class="subject-icon">${quizData[key].icon}</div>
                    <div class="subject-title">${quizData[key].title}</div>
                    <div class="subject-desc">${quizData[key].desc}</div>
                </div>
                <div>
                    <div class="subject-meta">👾 ${qCount} QUESTS</div>
                    <button class="btn-start" onclick="startQuiz('${key}')">START QUEST</button>
                </div>
            `;
            grid.appendChild(card);
        }

        document.getElementById("total-subjects").innerText = totalSubjectsCount;
        document.getElementById("total-questions").innerText = totalQuestionsCount;
    }

    function startQuiz(subjectKey) {
		const studentNameInput = document.getElementById("student-name").value.trim();
		if (!studentNameInput) {
			alert("PLEASE ENTER YOUR PLAYER NAME FIRST!");
			document.getElementById("student-name").focus();
			return;
		}

		activeSubjectKey = subjectKey;
		const currentQuiz = quizData[subjectKey];

		currentShuffledQuestions = shuffleArray(currentQuiz.questions).map(qObj => {
			return {
				...qObj,
				shuffledOptions: shuffleArray(qObj.options)
			};
		});

		document.getElementById("current-quiz-title").innerText = `${currentQuiz.icon} ${currentQuiz.title}`;
		document.getElementById("result-box").style.display = "none";
		document.getElementById("save-status").style.display = "none";
		document.querySelector(".submit-btn").style.display = "block";

		const container = document.getElementById("quiz-container");
		container.innerHTML = "";

		currentShuffledQuestions.forEach((qObj, index) => {
			const card = document.createElement("div");
			card.className = "question-card";

			let optionsHtml = "";
			const optionPrefixes = ["ก", "ข", "ค", "ง"];

			qObj.shuffledOptions.forEach((opt, optIndex) => {
				const prefix = optionPrefixes[optIndex];
				// ตัดคำว่า ก. ข. ค. ง. ออก เหลือเฉพาะข้อความคำตอบ
				const cleanOptText = opt.replace(/^[ก-ง]\.\s*/, '');

				optionsHtml += `
					<label class="option-label">
						<input type="radio" name="q${index}" value="${cleanOptText}" onchange="updateProgress()"> ${prefix}. ${cleanOptText}
					</label>
				`;
			});

			card.innerHTML = `
				<div class="question-title">Q${index + 1}: ${qObj.q}</div>
				<div class="options-group">${optionsHtml}</div>
				<div class="explanation" id="exp${index}"></div>
			`;
			container.appendChild(card);
		});

		document.getElementById("dashboard-page").classList.remove("active-page");
		document.getElementById("quiz-page").classList.add("active-page");
		updateProgress();
		window.scrollTo({ top: 0, behavior: 'smooth' });
	}

	function checkQuiz() {
		let score = 0;
		let total = currentShuffledQuestions.length;
		let wrongCount = 0;

		currentShuffledQuestions.forEach((qObj, index) => {
			let selected = document.querySelector(`input[name="q${index}"]:checked`);
			let expDiv = document.getElementById(`exp${index}`);
			
			expDiv.style.display = "block";
			
			// ตัด ก. ข. ค. ง. ออกจากคำตอบที่ถูกต้องเพื่อนำมาเปรียบเทียบ
			const cleanCorrectAns = qObj.ans.replace(/^[ก-ง]\.\s*/, '');

			if (selected) {
				if (selected.value === cleanCorrectAns) {
					score++;
					expDiv.className = "explanation correct-ans";
					expDiv.innerHTML = `<div class="exp-header">✓ CORRECT!</div>${qObj.explain}`;
				} else {
					wrongCount++;
					expDiv.className = "explanation wrong-ans";
					expDiv.innerHTML = `<div class="exp-header">✗ WRONG! (CORRECT: ${qObj.ans})</div>${qObj.explain}`;
				}
			} else {
				wrongCount++;
				expDiv.className = "explanation wrong-ans";
				expDiv.innerHTML = `<div class="exp-header">✗ MISSED! (CORRECT: ${qObj.ans})</div>${qObj.explain}`;
			}
		});

		let resultBox = document.getElementById("result-box");
		let resultScore = document.getElementById("result-score");
		let resultText = document.getElementById("result-text");
		let analyticsContainer = document.getElementById("analytics-container");

		resultBox.style.display = "block";
		document.querySelector(".submit-btn").style.display = "none";
		resultScore.innerHTML = `${score}/${total}`;
		
		let percentage = (score / total) * 100;

		if (percentage >= 80) {
			confetti({
				particleCount: 120,
				spread: 70,
				origin: { y: 0.6 },
				shapes: ['square']
			});
			resultText.innerHTML = "🏆 RANK S - PERFECT VICTORY!";
		} else if (percentage >= 50) {
			resultText.innerHTML = "👍 RANK A - STAGE CLEAR!";
		} else {
			resultText.innerHTML = "💀 GAME OVER - TRY AGAIN!";
		}

		analyticsContainer.innerHTML = `
			<b>📊 QUEST SUMMARY:</b><br>
			• ACCURACY: <span style="color:var(--pixel-green); font-weight:bold;">${percentage.toFixed(0)}%</span> (${score} Correct)<br>
			• MISSED: <span style="color:var(--pixel-red); font-weight:bold;">${wrongCount} Quests</span><br>
			<i>💡 SCROLL UP TO REVIEW YOUR ANSWERS</i>
		`;

		const userName = document.getElementById("student-name").value.trim() || "PLAYER 1";
		const categoryName = quizData[activeSubjectKey].title;
		sendQuizResult(userName, categoryName, score, total);

		window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
	}

    function updateProgress() {
        if (!currentShuffledQuestions.length) return;
        let answeredCount = 0;
        currentShuffledQuestions.forEach((_, index) => {
            if (document.querySelector(`input[name="q${index}"]:checked`)) {
                answeredCount++;
            }
        });

        let percent = (answeredCount / currentShuffledQuestions.length) * 100;
        document.getElementById("progress-bar").style.width = percent + "%";
    }

    function showDashboard() {
        document.getElementById("quiz-page").classList.remove("active-page");
        document.getElementById("dashboard-page").classList.add("active-page");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function sendQuizResult(userName, categoryName, score, total) {
        const statusBox = document.getElementById("save-status");
        statusBox.style.display = "block";
        statusBox.style.backgroundColor = "var(--nav-bg)";
        statusBox.style.color = "var(--pixel-yellow)";
        statusBox.innerText = "⏳ SAVING SCORE TO LEADERBOARD...";

        const data = { name: userName, category: categoryName, score: score, total: total };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.status === "success") {
                statusBox.style.backgroundColor = "rgba(80, 250, 123, 0.2)";
                statusBox.style.color = "var(--pixel-green)";
                statusBox.innerText = "✅ SCORE SAVED TO LEADERBOARD!";
                loadLeaderboard();
            } else {
                throw new Error(result.message || "ERROR");
            }
        })
        .catch(error => {
            console.error('Error recording result:', error);
            statusBox.style.backgroundColor = "rgba(255, 85, 85, 0.2)";
            statusBox.style.color = "var(--pixel-red)";
            statusBox.innerText = "❌ FAILED TO SAVE SCORE!";
        });
    }

    function loadLeaderboard() {
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--text-muted);">⏳ LOADING HIGH SCORES...</td></tr>`;

        fetch(GOOGLE_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                rawLeaderboardData = data || [];
                updateCategoryDropdown();
                renderLeaderboardTable();
            })
            .catch(error => {
                console.error("Error loading leaderboard:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 15px; color: var(--pixel-red);">❌ FAILED TO LOAD SCORES</td></tr>`;
            });
    }

    function updateCategoryDropdown() {
        const filterSelect = document.getElementById("leaderboard-filter");
        const currentValue = filterSelect.value;
        const categories = [...new Set(rawLeaderboardData.map(item => item.category))];
        
        let optionsHtml = `<option value="ALL">🌐 ALL STAGES</option>`;
        categories.forEach(cat => {
            if (cat) {
                optionsHtml += `<option value="${cat}">👾 ${cat}</option>`;
            }
        });

        filterSelect.innerHTML = optionsHtml;
        filterSelect.value = categories.includes(currentValue) ? currentValue : "ALL";
    }

    function renderLeaderboardTable() {
        const tbody = document.getElementById("leaderboard-body");
        const selectedCategory = document.getElementById("leaderboard-filter").value;

        let filteredData = rawLeaderboardData;
        if (selectedCategory !== "ALL") {
            filteredData = rawLeaderboardData.filter(item => item.category === selectedCategory);
        }

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">NO HIGH SCORES YET</td></tr>`;
            return;
        }

        let html = "";
        filteredData.forEach((item, index) => {
            let badge = index + 1;
            if (index === 0) badge = "🥇 1ST";
            else if (index === 1) badge = "🥈 2ND";
            else if (index === 2) badge = "🥉 3RD";

            let percentText = item.percent <= 1 && item.percent > 0 
                ? (item.percent * 100).toFixed(0) + "%" 
                : item.percent + "%";

            html += `
                <tr>
                    <td style="font-weight: bold; color: var(--pixel-yellow); font-family: 'Press Start 2P', monospace; font-size: 0.8rem;">${badge}</td>
                    <td style="font-weight: bold;">${item.name}</td>
                    <td style="color: var(--text-muted); font-size: 0.9rem;">${item.category}</td>
                    <td style="text-align: center; font-weight: bold; font-family: 'Press Start 2P', monospace; font-size: 0.8rem;">${item.score}/${item.total}</td>
                    <td style="text-align: right; color: var(--pixel-green); font-weight: bold; font-family: 'Press Start 2P', monospace; font-size: 0.8rem;">${percentText}</td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }
</script>

</body>
</html>
